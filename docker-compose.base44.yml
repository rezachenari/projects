name: pars-vitrin

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: parsvitrin
      POSTGRES_PASSWORD: parsvitrin_local_dev
      POSTGRES_DB: parsvitrin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parsvitrin -d parsvitrin']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  # One-shot schema + content sync. Runs before the API starts.
  migrate:
    build:
      context: ./backend
    restart: 'no'
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://parsvitrin:parsvitrin_local_dev@db:5432/parsvitrin
    command:
      ['sh', '-ec', 'npm install --no-audit --no-fund && node src/seed.js']
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: on-failure
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://parsvitrin:parsvitrin_local_dev@db:5432/parsvitrin
      - PORT=8000
      - NODE_ENV=development
    command: ['sh', '-ec', 'npm install --no-audit --no-fund && exec npm run dev']
    ports:
      - '8000:8000'
    labels:
      base44.project: 'Pars Vitrin API'
      base44.kind: 'api'
      base44.port: '8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./frontend
    restart: on-failure
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - API_INTERNAL_URL=http://api:8000
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ['sh', '-ec', 'npm install --no-audit --no-fund && exec npm run dev']
    ports:
      - '3000:5173'
    labels:
      base44.project: 'Pars Vitrin'
      base44.kind: 'web'
      base44.port: '3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5173/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  frontend_node_modules:
  backend_node_modules:
